<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">NOVA — макет сценария ценовых уведомлений</title>
  <desc id="desc">Аккуратный макет desktop-экрана, формы, состояний загрузки, успеха, ошибки и мобильной версии.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .canvas{fill:#05080d}.screen{fill:#070b11;stroke:#1b2635;stroke-width:1.5}.panel{fill:#0d131c;stroke:#1b2635;stroke-width:1.5}.raised{fill:#111a26}.line{stroke:#1b2635;stroke-width:1.5}.white{fill:#f4f7fa}.muted{fill:#8b98aa}.lime{fill:#b8f43d}.cyan{fill:#38bdf8}.green{fill:#34d399}.rose{fill:#fb7185}.orange{fill:#f7931a}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#8b98aa}.display{font-size:30px;font-weight:700;fill:#f4f7fa}.title{font-size:20px;font-weight:700;fill:#f4f7fa}.subtitle{font-size:15px;font-weight:400;fill:#8b98aa}.body{font-size:14px;font-weight:400;fill:#f4f7fa}.label{font-size:12px;font-weight:600;fill:#8b98aa}.small{font-size:11px;font-weight:400;fill:#8b98aa}.buttonText{font-size:13px;font-weight:700;fill:#070b11}.nav{font-size:13px;font-weight:500;fill:#8b98aa}.navActive{font-size:13px;font-weight:700;fill:#b8f43d}.number{font-size:14px;font-weight:700;fill:#f4f7fa}.status{font-size:11px;font-weight:700;fill:#38bdf8}
    </style>
  </defs>

  <rect width="1600" height="1200" class="canvas"/>

  <!-- Document header -->
  <g transform="translate(64 52)">
    <rect width="44" height="44" rx="12" class="lime"/>
    <text x="14" y="29" font-size="19" font-weight="800" fill="#070b11">N</text>
    <text x="62" y="25" class="display">NOVA · Price Alerts</text>
    <text x="62" y="51" class="subtitle">Основной пользовательский сценарий · desktop 1440 px · mobile 390 px</text>
  </g>

  <!-- Desktop screen -->
  <g transform="translate(64 138)">
    <text y="-18" class="eyebrow">01 · ОСНОВНОЙ DESKTOP-ЭКРАН</text>
    <rect width="960" height="520" rx="20" class="screen"/>

    <!-- Sidebar -->
    <path d="M180 0v520" class="line"/>
    <g transform="translate(22 26)">
      <rect width="34" height="34" rx="10" class="lime"/>
      <text x="11" y="23" font-size="15" font-weight="800" fill="#070b11">N</text>
      <text x="46" y="23" font-size="17" font-weight="750" class="white">NOVA</text>
    </g>
    <g transform="translate(22 104)">
      <circle cx="7" cy="7" r="4" fill="#1b2635"/><text x="22" y="12" class="nav">Обзор</text>
      <circle cx="7" cy="59" r="4" fill="#1b2635"/><text x="22" y="64" class="nav">Рынок</text>
      <circle cx="7" cy="111" r="4" fill="#1b2635"/><text x="22" y="116" class="nav">Кошелёк</text>
      <circle cx="7" cy="163" r="4" fill="#1b2635"/><text x="22" y="168" class="nav">История</text>
      <rect x="-8" y="199" width="144" height="44" rx="10" fill="#b8f43d14"/>
      <path d="M2 217c4-4 4-8 4-11a7 7 0 0 1 14 0c0 3 0 7 4 11H2Zm7 4h8" fill="none" stroke="#b8f43d" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="226" class="navActive">Уведомления</text>
    </g>

    <!-- Header -->
    <path d="M180 66h780" class="line"/>
    <text x="208" y="39" class="label">Учебный торговый терминал</text>
    <circle cx="916" cy="33" r="14" fill="#38bdf82a"/>
    <text x="868" y="38" class="body" text-anchor="end">Egor · Demo</text>

    <!-- Main heading -->
    <g transform="translate(208 96)">
      <rect width="42" height="42" rx="11" fill="#b8f43d12"/>
      <path d="M12 26c4-4 4-8 4-11a5 5 0 0 1 10 0c0 3 0 7 4 11H12Zm7 4h4" fill="none" stroke="#b8f43d" stroke-width="2" stroke-linecap="round"/>
      <rect x="54" y="6" width="92" height="30" rx="15" fill="#38bdf817"/>
      <text x="100" y="26" class="status" text-anchor="middle">2 АКТИВНЫХ</text>
      <text y="82" class="display">Ценовые уведомления</text>
      <text y="110" class="subtitle">Следите за целевой ценой, не открывая рынок весь день.</text>
    </g>

    <!-- Create button -->
    <g transform="translate(742 112)">
      <rect width="190" height="44" rx="11" class="lime"/>
      <path d="M20 22h14M27 15v14" stroke="#070b11" stroke-width="2" stroke-linecap="round"/>
      <text x="46" y="27" class="buttonText">Создать уведомление</text>
    </g>

    <!-- Filters -->
    <g transform="translate(208 238)">
      <rect width="54" height="34" rx="10" class="raised"/><text x="27" y="22" class="body" text-anchor="middle">Все</text>
      <text x="78" y="22" class="label">Активные</text><text x="162" y="22" class="label">Сработавшие</text><text x="278" y="22" class="label">Отменённые</text>
    </g>

    <!-- Table -->
    <g transform="translate(208 292)">
      <rect width="724" height="190" rx="16" class="panel"/>
      <path d="M0 46h724M0 118h724" class="line"/>
      <rect x="1" y="1" width="722" height="45" rx="15" class="raised"/>
      <text x="18" y="28" class="eyebrow">АКТИВ</text><text x="178" y="28" class="eyebrow">УСЛОВИЕ</text><text x="314" y="28" class="eyebrow">ЦЕЛЬ</text><text x="430" y="28" class="eyebrow">ТЕКУЩАЯ</text><text x="552" y="28" class="eyebrow">СТАТУС</text>

      <circle cx="28" cy="82" r="16" class="orange"/><text x="54" y="79" class="body" font-weight="700">BTC</text><text x="54" y="96" class="small">Bitcoin</text>
      <text x="178" y="86" class="body">Цена выше</text><text x="314" y="86" class="number">$75,000</text><text x="430" y="86" class="body">$68,000</text>
      <rect x="552" y="66" width="76" height="30" rx="15" fill="#38bdf817"/><text x="590" y="85" class="status" text-anchor="middle">АКТИВНО</text><text x="654" y="86" class="small">Отменить</text>

      <circle cx="28" cy="154" r="16" class="orange"/><text x="54" y="151" class="body" font-weight="700">ETH</text><text x="54" y="168" class="small">Ethereum</text>
      <text x="178" y="158" class="body">Цена ниже</text><text x="314" y="158" class="number">$3,200</text><text x="430" y="158" class="body">$3,600</text>
      <rect x="552" y="138" width="76" height="30" rx="15" fill="#38bdf817"/><text x="590" y="157" class="status" text-anchor="middle">АКТИВНО</text><text x="654" y="158" class="small">Отменить</text>
    </g>
  </g>

  <!-- Form -->
  <g transform="translate(1056 138)">
    <text y="-18" class="eyebrow">02 · ФОРМА СОЗДАНИЯ</text>
    <rect width="480" height="520" rx="22" class="panel" filter="url(#shadow)"/>
    <text x="26" y="42" class="title">Создать ценовое уведомление</text>
    <text x="26" y="66" class="subtitle">Сообщим, когда рынок достигнет вашей цели.</text>
    <text x="447" y="43" class="muted" font-size="20">×</text>
    <path d="M0 88h480" class="line"/>

    <text x="26" y="122" class="label">Криптовалюта</text>
    <rect x="26" y="134" width="428" height="48" rx="11" fill="#070b11" stroke="#334155" stroke-width="1.5"/>
    <text x="42" y="164" class="body">Bitcoin (BTC)</text><text x="432" y="164" class="muted" font-size="15">⌄</text>

    <text x="26" y="216" class="label">Условие</text>
    <rect x="26" y="228" width="428" height="46" rx="11" fill="#070b11"/>
    <rect x="26" y="228" width="214" height="46" rx="11" class="cyan"/>
    <text x="133" y="256" class="buttonText" text-anchor="middle">Цена выше</text>
    <text x="347" y="256" class="label" text-anchor="middle">Цена ниже</text>

    <text x="26" y="308" class="label">Целевая цена, USD</text>
    <rect x="26" y="320" width="428" height="48" rx="11" fill="#070b11" stroke="#334155" stroke-width="1.5"/>
    <text x="42" y="350" class="muted" font-size="14">$</text><text x="62" y="350" class="body">75 000</text>

    <rect x="26" y="390" width="428" height="56" rx="11" fill="#b8f43d0a" stroke="#b8f43d33"/>
    <path d="M42 420c4-4 4-8 4-11a5 5 0 0 1 10 0c0 3 0 7 4 11H42Z" fill="none" stroke="#b8f43d" stroke-width="1.8"/>
    <text x="76" y="414" class="body" font-weight="700">Внутреннее уведомление</text><text x="76" y="432" class="small">Появится в центре событий NOVA</text>

    <rect x="26" y="462" width="204" height="42" rx="10" class="raised"/><text x="128" y="488" class="body" text-anchor="middle" font-weight="700">Отмена</text>
    <rect x="250" y="462" width="204" height="42" rx="10" class="lime"/><text x="352" y="488" class="buttonText" text-anchor="middle">Создать</text>
  </g>

  <!-- Compact states -->
  <g transform="translate(64 728)">
    <text y="-18" class="eyebrow">03 · СОСТОЯНИЕ ОТПРАВКИ</text>
    <rect width="342" height="202" rx="18" class="panel"/>
    <text x="22" y="40" class="title">Создаём уведомление</text>
    <text x="22" y="67" class="subtitle">Поля временно недоступны.</text>
    <rect x="22" y="94" width="298" height="46" rx="10" fill="#769f27"/>
    <circle cx="125" cy="117" r="7" fill="none" stroke="#070b11" stroke-width="2.5" stroke-dasharray="12 7"/>
    <text x="145" y="122" class="buttonText">Создаём…</text>
    <text x="22" y="170" class="small">Двойной клик и повторный Enter</text>
    <text x="22" y="186" class="small">не создают второй запрос.</text>
  </g>

  <g transform="translate(430 728)">
    <text y="-18" class="eyebrow">04 · УСПЕШНЫЙ РЕЗУЛЬТАТ</text>
    <rect width="342" height="202" rx="18" class="panel"/>
    <rect x="20" y="20" width="302" height="46" rx="10" fill="#10231c"/>
    <text x="38" y="49" font-size="13" font-weight="650" class="green">✓ Уведомление создано</text>
    <circle cx="42" cy="105" r="17" class="orange"/>
    <text x="70" y="103" class="title">Bitcoin</text><text x="70" y="122" class="small">BTC</text>
    <rect x="240" y="91" width="76" height="28" rx="14" fill="#38bdf817"/><text x="278" y="109" class="status" text-anchor="middle">АКТИВНО</text>
    <text x="22" y="164" class="label">Цена выше</text><text x="320" y="164" class="number" text-anchor="end">$75,000</text>
  </g>

  <g transform="translate(796 728)">
    <text y="-18" class="eyebrow">05 · ОШИБКА И ПОВТОР</text>
    <rect width="342" height="202" rx="18" class="panel"/>
    <rect x="20" y="20" width="302" height="88" rx="11" fill="#28151a"/>
    <text x="38" y="51" font-size="13" font-weight="700" class="rose">Не удалось загрузить данные</text>
    <text x="38" y="76" class="small">Проверьте соединение и повторите</text><text x="38" y="92" class="small">попытку.</text>
    <rect x="178" y="132" width="144" height="42" rx="10" class="rose"/>
    <text x="250" y="158" class="buttonText" text-anchor="middle">↻ Повторить</text>
  </g>

  <!-- Mobile -->
  <g transform="translate(1168 728)">
    <text y="-18" class="eyebrow">06 · MOBILE 390 PX</text>
    <rect width="368" height="402" rx="26" class="screen"/>
    <text x="22" y="38" class="title">NOVA</text><circle cx="328" cy="31" r="15" fill="#38bdf82a"/>
    <text x="22" y="82" class="title">Ценовые уведомления</text>
    <text x="22" y="106" class="small">Следите за целевой ценой без постоянного</text><text x="22" y="122" class="small">наблюдения.</text>
    <rect x="22" y="144" width="324" height="44" rx="11" class="lime"/>
    <path d="M92 166h12M98 160v12" stroke="#070b11" stroke-width="2" stroke-linecap="round"/>
    <text x="116" y="171" class="buttonText">Создать уведомление</text>

    <rect x="22" y="214" width="324" height="154" rx="16" class="panel"/>
    <circle cx="50" cy="244" r="16" class="orange"/>
    <text x="76" y="242" class="body" font-weight="700">Bitcoin</text><text x="76" y="260" class="small">BTC</text>
    <rect x="256" y="230" width="72" height="28" rx="14" fill="#38bdf817"/><text x="292" y="248" class="status" text-anchor="middle">АКТИВНО</text>
    <text x="38" y="304" class="small">Условие</text><text x="38" y="326" class="body">Цена выше</text>
    <text x="224" y="304" class="small">Целевая цена</text><text x="328" y="326" class="number" text-anchor="end">$75,000</text>
  </g>

  <!-- Scenario footer -->
  <g transform="translate(64 994)">
    <rect width="1074" height="136" rx="18" fill="#0a1019" stroke="#1b2635"/>
    <text x="24" y="35" class="title">Проверка сценария</text>
    <g transform="translate(24 56)">
      <rect width="184" height="42" rx="10" class="raised"/><text x="92" y="26" class="body" text-anchor="middle">1. Открыть форму</text>
      <text x="202" y="27" class="muted" font-size="18">›</text>
      <rect x="224" width="184" height="42" rx="10" class="raised"/><text x="316" y="26" class="body" text-anchor="middle">2. Заполнить</text>
      <text x="426" y="27" class="muted" font-size="18">›</text>
      <rect x="448" width="184" height="42" rx="10" class="raised"/><text x="540" y="26" class="body" text-anchor="middle">3. Отправить</text>
      <text x="650" y="27" class="muted" font-size="18">›</text>
      <rect x="672" width="208" height="42" rx="10" fill="#b8f43d14" stroke="#b8f43d44"/><text x="776" y="26" class="navActive" text-anchor="middle">4. Увидеть результат</text>
    </g>
    <text x="24" y="120" class="small">Доступность: label · focus-visible · Escape · aria-live · текстовые статусы · управление с клавиатуры</text>
  </g>
</svg>
